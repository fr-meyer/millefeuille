[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "millefeuille"
version = "0.5.0"
description = "Run the source-pack, extraction, OpenKB handoff, acceptance, and classification lifecycle for research-paper attachments discovered from Zotero."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["zotero", "ocr", "document-ai", "pdf", "markdown", "hydra", "mistral", "pageindex"]
authors = [
    {name = "Franck MEYER", email = "franck.meyer@kaist.ac.kr"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "pyzotero",
    "mistralai<2",
    "tabulate",
    "pageindex",
    "markdown-it-py",
    "mdit-py-plugins",
    "hydra-core>=1.3.0",
    "omegaconf",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.23",
    "ruff>=0.9",
]

[project.scripts]
millefeuille = "millefeuille.cli.main:entrypoint"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["millefeuille*"]
exclude = ["tests*", "*.tests*", "*.tests.*", "tests.*"]

[tool.setuptools.package-data]
millefeuille = ["conf/**/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
]

[tool.ruff.lint.isort]
known-first-party = ["millefeuille"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# python-semantic-release: GitHub tags + GitHub Releases on `main` only.
# Keep tag_format without a `v` prefix to match existing tags 0.1.0–0.4.0.
# Do not upload to PyPI. Partial tags (0, 0.5) are disabled.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "{version}"
allow_zero_version = true
major_on_zero = false
add_partial_tags = false
build_command = "true"

[tool.semantic_release.branches.main]
match = "(main)"
prerelease = false
