# CANDIDATE replacement for existing .github/workflows/ci.yml on a tooling branch ONLY.
# Broker must verify branch dispatch support; no main/default-branch mutation assumed.
name: P09 clean dependency provenance proposal v3
on:
  workflow_dispatch:
    inputs:
      tooling_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f0dc10a9e3ff005ff442f14e5f5129b7515dcd0f
          path: product
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Validate exact tooling identity and qualify fresh normal install
        shell: python
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, pathlib, re, subprocess, sys
          sha = os.environ['TOOLING_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          actual = subprocess.check_output(['git','-C','tooling','rev-parse','HEAD'], text=True).strip()
          assert actual == sha
          script = pathlib.Path('tooling/scripts/p09/stage.py').resolve()
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p09-qualified'
          subprocess.run([sys.executable,'-B',str(script),'--source',str(pathlib.Path('product').resolve()),'--root',str(root)], check=True, timeout=960)
      - name: Retain only sanitized validated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p09-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/p09-qualified/SUMMARY.json
            ${{ runner.temp }}/p09-qualified/COMMANDS.json
            ${{ runner.temp }}/p09-qualified/OUTCOME.json
          if-no-files-found: error
          retention-days: 14
