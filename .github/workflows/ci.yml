name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact candidate source
        run: python -B .github/ci/validate.py source .github/ci/source-pins.json
      - name: Install cloud build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,native]"
      - name: Lint
        run: python -m ruff check .
      - name: Offline Linux tests (loopback-only namespace, normal user)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net -- bash -c 'set -eu; ip link set lo up; export HOME="$4" PATH="$5"; exec setpriv --reuid "$1" --regid "$2" --init-groups "$3" -B .github/ci/run_tests.py' ci "$(id -u)" "$(id -g)" "$(command -v python)" "$HOME" "$PATH"
      - name: Offline Windows Python tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $rule = New-NetFirewallRule -DisplayName 'Millefeuille CI Python offline' -Direction Outbound -Program $python -RemoteAddress Internet -Action Block
          if ($rule.Enabled -ne 'True') { throw 'Offline firewall not active' }
          python -B .github/ci/run_tests.py

  optimized:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B .github/ci/validate.py source .github/ci/source-pins.json
      - run: python -m pip install -e ".[test,native]"
      - name: Optimized offline tests
        shell: bash
        run: |
          sudo unshare --net -- bash -c 'set -eu; ip link set lo up; export HOME="$4" PATH="$5"; exec setpriv --reuid "$1" --regid "$2" --init-groups "$3" -O -B .github/ci/run_tests.py' ci "$(id -u)" "$(id -g)" "$(command -v python)" "$HOME" "$PATH"

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B .github/ci/validate.py source .github/ci/source-pins.json
      - name: Cloud dependency preparation and independent builds
        shell: bash
        run: |
          python -m pip install build setuptools wheel
          python -m build --no-isolation
          python -m pip wheel --wheel-dir wheelhouse ".[test,native]"
          python -m pip wheel --no-index --no-deps --no-build-isolation dist/*.tar.gz -w dist/from-sdist
          python -B .github/ci/validate.py archives .github/ci/source-pins.json
      - name: Isolated offline installs
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-index --find-links wheelhouse "$(echo dist/*.whl)[test,native]"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install --no-index --find-links wheelhouse "$(echo dist/from-sdist/*.whl)[test,native]"
      - name: Installed provenance and privacy outside source, network isolated
        shell: bash
        run: |
          status=0
          for kind in wheel sdist; do
            sudo unshare --net -- bash -c 'set -eu; ip link set lo up; export HOME="$4"; unset PYTHONPATH PYTHONHOME; cd "$5"; exec setpriv --reuid "$1" --regid "$2" --init-groups "$3" -I -B "$6/.github/ci/validate.py" installed "$6/.github/ci/source-pins.json" "$6/.ci-output/installed-$7.json"' ci "$(id -u)" "$(id -g)" "$RUNNER_TEMP/$kind-env/bin/python" "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$kind" || status=1
          done
          exit "$status"
      - name: Installed wheel and rebuilt-sdist regression suites
        shell: bash
        run: |
          status=0
          for kind in wheel sdist; do
            if [ "$kind" = wheel ]; then artifact=("$GITHUB_WORKSPACE"/dist/*.whl); else artifact=("$GITHUB_WORKSPACE"/dist/from-sdist/*.whl); fi
            sudo unshare --net -- bash -c 'set -eu; ip link set lo up; unset PYTHONPATH PYTHONHOME; cd "$5"; exec setpriv --reuid "$1" --regid "$2" --init-groups "$3" -I -B "$6/.github/ci/installed_tests.py" "$6" "$8" "$7" "$9"' ci "$(id -u)" "$(id -g)" "$RUNNER_TEMP/$kind-env/bin/python" "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$kind" "${artifact[0]}" "$(git rev-parse HEAD)" || status=1
          done
          exit "$status"
      - name: Upload installed outcomes even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-results-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: .ci-output/installed-*.json
      - name: Upload screened packages and fixed provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-distributions-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/from-sdist/*.whl
            .ci-output/*.json
