# CANDIDATE replacement for existing .github/workflows/ci.yml on a tooling branch ONLY.
# Broker must verify branch dispatch support; no main/default-branch mutation assumed.
name: P09 clean dependency provenance proposal v4
on:
  workflow_dispatch:
    inputs:
      tooling_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f0dc10a9e3ff005ff442f14e5f5129b7515dcd0f
          path: product
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Validate exact tooling identity and qualify fresh normal install
        shell: python
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          import hashlib, os, pathlib, re, subprocess, sys
          sha = os.environ['TOOLING_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          actual = subprocess.check_output(['git','-C','tooling','rev-parse','HEAD'], text=True).strip()
          assert actual == sha
          script = pathlib.Path('tooling/scripts/p09/stage.py').resolve()
          expected = {'capture.py': 'f81c137da71f690fb6fe0de61a652902ba4de9a5875b198853e7aa79e52c320d', 'stage.py': 'e4f9f6eb3ad0b7f11fb1a36689b7b6d891589d8c3377dde09349c9c4151579d5'}
          for name, digest in expected.items():
              assert hashlib.sha256((script.parent / name).read_bytes()).hexdigest() == digest
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p09-qualified'
          subprocess.run([sys.executable,'-B',str(script),'--source',str(pathlib.Path('product').resolve()),'--root',str(root)], check=True, timeout=960)
      - name: Retain only sanitized validated evidence in job log
        if: always()
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p09-qualified'
          for name in ('SUMMARY.json', 'COMMANDS.json', 'OUTCOME.json'):
              path = root / name
              if not path.is_file():
                  print('P09_EVIDENCE_MISSING', name)
                  continue
              with path.open('rb') as stream:
                  raw = stream.read(1048577)
              if len(raw) > 1048576:
                  raise SystemExit('P09 evidence log cap exceeded')
              json.loads(raw)
              digest = hashlib.sha256(raw).hexdigest()
              encoded = base64.b64encode(raw).decode('ascii')
              print('P09_EVIDENCE_BEGIN', name, len(raw), digest)
              for start in range(0, len(encoded), 16384):
                  print('P09_EVIDENCE_CHUNK', name, start // 16384, encoded[start:start + 16384])
              print('P09_EVIDENCE_END', name, digest)
