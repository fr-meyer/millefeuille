defaults:
  - base_default
  - _self_

# Tagging workflow configuration
selection:
  include:
    values:
      - docai
    operator: "or"
  exclude:
    values:
      - docai-processed
    operator: "or"
  conflict_resolution: "exclude_wins"

apply_on_success:
  values:
    - docai-processed

apply_on_error:
  values:
    - docai-error

remove_on_success:
  values: []
remove_on_error:
  values: []

include_abstract: false
