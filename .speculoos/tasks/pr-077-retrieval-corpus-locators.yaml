scope:
  - extend the read-only retrieve command with paper-id, Zotero-key, source-pack-slug, DOI, and title locators
  - normalize exact DOI and title queries while rejecting missing or ambiguous corpus matches
  - validate every resolved source pack, run manifest, artifact index, paper card, summary bundle, and index status before returning refs
  - add section, page, and classification-evidence summary filtering without returning private paper content
  - reject traversal-unsafe package ids, invalid pages, cross-wired card identities, and symlinked corpus cards
  - document the offline retrieval surface and retain deterministic ref-only output
non_goals:
  - multi-run or batch retrieval result manifests
  - reading or returning full paper, summary, or card content
  - live OpenKB, PageIndex, ConDB, ChatIndex, Zotero, source-pack, or index writes
  - live provider/model calls, PDF recovery, OCR, or worker-agent execution
  - credentials, permissions, rulesets, or secret handling changes
  - dev-to-main promotion, release tag, package publication, or production deployment
acceptance:
  - direct paper-id, Zotero-key, and source-pack-slug locators resolve one verified run package
  - DOI URLs/prefixes and title whitespace/case normalize to one exact local paper-card identity match
  - missing and ambiguous corpus identity queries fail closed without returning content
  - page and exact section filters select matching structured summary refs
  - classification-evidence mode selects classification-scoped summaries and retains card, index, acceptance, classification, and writeback refs when present
  - paper/run traversal, invalid pages, conflicting filters, symlinked cards, and identity drift fail closed
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, Speculoos validation, and publication checks pass
