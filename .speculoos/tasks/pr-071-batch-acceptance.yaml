scope:
  - extend the existing offline acceptance command with an explicit versioned batch manifest
  - resolve and synthesize every listed existing paper/run package before batch-owned writes begin
  - reject traversal-unsafe batch ids, invalid locators, and duplicate resolved paper/run identities
  - sort run results deterministically and preserve single-run acceptance outputs
  - emit aggregate JSON and Markdown reports with portable source-root-relative refs
  - return pass only when every run passes while still materializing valid needs-review results
  - keep exact-input reruns byte-stable and document the batch storage and CLI contracts
non_goals:
  - live OpenKB, source-pack, index, Zotero, OCR, model, or provider reconciliation
  - approval-aware acceptance waivers or live-state exception handling
  - batch classification, larger taxonomy routing, adjudication, or worker-agent execution
  - downstream extraction or analysis of same-item multi-PDF packs
  - credentials, permissions, rulesets, or secret handling changes
  - dev-to-main promotion, release tag, package publication, or production deployment
acceptance:
  - a batch manifest identifies a non-empty set of paper or item locators and run ids
  - all run packages and evidence preflight before any acceptance or aggregate output is written
  - duplicate resolved paper/run pairs and unsafe batch ids fail without partial outputs
  - per-run summaries are written in deterministic order and aggregate counts/status are consistent
  - one needs-review run makes the aggregate needs-review without suppressing other valid run results
  - exact-input reruns preserve acceptance and aggregate output bytes
  - input/output JSON schemas and user-facing CLI/storage documentation describe the offline contract
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, Speculoos validation, and publication checks pass
