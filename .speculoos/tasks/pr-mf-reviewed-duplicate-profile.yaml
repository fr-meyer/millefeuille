id: pr-mf-reviewed-duplicate-profile
title: Recognize a verified reviewed duplicate as a retained separate profile
status: implementation
branch: feat/pr-mf-duplicate-review-20260927
base_branch: dev
write_paths:
  - README.md
  - .speculoos/tasks/pr-mf-reviewed-duplicate-profile.yaml
  - millefeuille/domain/duplicate_review.py
  - millefeuille/domain/acceptance.py
  - specs/millefeuille-pipeline/duplicate-profile-review.md
