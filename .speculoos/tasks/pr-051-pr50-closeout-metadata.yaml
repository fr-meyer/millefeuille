  - "git diff --check"
  - "speculoos status --json"
  - "speculoos validate --task pr-051-pr50-closeout-metadata --validation \"git diff --check\" --json"
publication_boundary:
  statement: "Metadata-only closeout; no live Zotero read or write, PDF recovery, OCR/Mistral/PageIndex provider call, model call, worker-agent execution, OpenKB write, index write, source-pack write, credential change, main-branch merge, release tag, package publication, or approval bypass."
