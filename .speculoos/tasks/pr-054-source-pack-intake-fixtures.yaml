scope:
  - add an offline source-pack intake writer for explicit local recovered-PDF fixture evidence
  - verify recovered bytes against expected SHA-256 before creating source-pack source evidence
  - write `source.pdf` and `manifest.json` under `<source-pack-root>/zotero/<paper-id>/`
  - require source-pack manifests to expose a `sha256:<hex>` source hash before artifact-root analysis writes treat them as verified
  - add a `millefeuille source-pack intake` CLI command that does not initialize Zotero, OCR, model, OpenKB, or index clients
  - carry forward PR #53 closeout merge facts in repo-local Speculoos ledgers
non_goals:
  - live Zotero reads or writes, lifecycle tag mutation, or live PDF recovery
  - OCR/Mistral/PageIndex provider calls, model calls, worker-agent execution, OpenKB writes, or index writes
  - hierarchical summaries, paper cards, classification, or retrieval-index population
  - changing credential values or secret handling
  - dev-to-main promotion, release tag, or package publication
acceptance:
  - fixture evidence intake writes source-pack source evidence only after SHA-256 verification
  - mismatched source hash or file size fails before source-pack creation
  - rerunning against identical evidence is idempotent
  - existing source-pack source or manifest drift is rejected without overwrite
  - source-pack artifact-root runs consume the manifest source hash in artifact-index output
  - the source-pack intake CLI succeeds without Zotero/provider environment variables
  - focused source-pack/artifact tests, full unittest discovery, Ruff, metadata parse, diff check, and Speculoos validate pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_source_pack_writer tests.test_millefeuille_artifact_writer tests.test_millefeuille_artifact_commands tests.test_millefeuille_contract_artifacts"
  - ".venv/bin/python -m unittest discover -v"
  - ".venv/bin/ruff check ."
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\", \"specs/**/*.yaml\"].flatten.sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\", \"specs/**/*.json\"].flatten.sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
  - "speculoos status --json"
  - "speculoos validate --task pr-054-source-pack-intake-fixtures --validation \"git diff --check\" --json"
