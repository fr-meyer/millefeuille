id: pr-039-offline-acceptance-summary
title: Add offline OpenKB acceptance summary and multi-attachment coverage
status: implementation
branch: test/pr-039-offline-acceptance-summary
base_branch: dev
github:
  issue: null
  pull_request: null
  issue_project_item: null
  pull_request_project_item: null
  project_status: In Progress
  project_item: null
scope:
  - add an offline acceptance summary that joins handoff rows, OpenKB outcomes, skip rows, and duplicate-scan evidence
  - add redacted duplicate-scan evidence for the docai-test fixture
  - add multi-attachment and non-PDF fixture coverage
  - close out stale PR #38 repo-local metadata as merged
non_goals:
  - live Zotero API calls or PDF downloads
  - Zotero tag, note, attachment, or library writes
  - Mistral, PageIndex, OpenKB, OCR, model, or provider calls
  - creating, modifying, deleting, or importing source packs
  - credential, model route, GitHub App permission, release, package-index, main-branch, or production change
acceptance:
  - acceptance summary status is pass when every OpenKB import has exactly one handoff row and one duplicate-scan evidence row
  - no-PDF and non-PDF skips are counted explicitly by event
  - unmatched handoff rows, OpenKB import rows, and duplicate-scan rows are surfaced as review items
  - duplicate-scan evidence that reports an existing match marks the summary as needing review
  - multi-attachment fixtures keep per-attachment identity stable and skip non-PDF attachments before handoff export
  - fixture files remain redacted and contain no PDF payloads, signed URLs, credentials, provider payloads, or source-pack content
validation:
  - .venv/bin/python -m unittest -v tests.test_openkb_docai_test_fixture tests.test_openkb_handoff_multi_attachment_fixture
  - .venv/bin/python -m unittest discover -v
  - .venv/bin/ruff check .
  - ruby -ryaml -rjson -e 'Dir[".speculoos/**/*.yaml"].sort.each { |p| Psych.parse_file(p) }; Dir[".speculoos/**/*.json"].sort.each { |p| JSON.parse(File.read(p)) }; puts "metadata ok"'
  - git diff --check
  - speculoos status --json
  - speculoos actors --json
  - speculoos validate --task pr-039-offline-acceptance-summary --validation "git diff --check" --json
  - changed-file private-data and payload scan
evidence:
  - targeted acceptance-summary and multi-attachment fixture tests passed, 8 tests
  - full unittest discovery passed, 131 tests
  - Ruff passed
  - metadata parse passed
  - git diff --check passed
  - speculoos status, actors, and validate passed with only expected local unpublished/dirty warnings before commit
  - fixture/docs marker scan found no credential, signed URL, or PDF payload markers
publication_boundary:
  statement: "Offline implementation/test slice only; no live Zotero, PDF download, OCR, Mistral, PageIndex, OpenKB write, source-pack write, GitHub publication, or merge without separate approval."
links:
