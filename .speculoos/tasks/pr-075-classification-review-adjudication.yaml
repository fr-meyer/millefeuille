scope:
  - extend the existing offline classify command with explicit single-run action evidence
  - materialize immutable review no-change, correction, escalation, adjudication confirmation, correction, and taxonomy-change-request outcomes
  - verify the prior decision ref, run identity, source hash, locked taxonomy, mode/outcome pairing, and local evidence before any writes
  - emit deterministic action records, final decision records, writeback previews, adjudication queues, and taxonomy-change requests
  - update the current classification plan, stage manifest, and artifact index without mutating the locked taxonomy
  - keep exact-input reruns byte-stable and document the action storage, schema, CLI, status, and exit contracts
non_goals:
  - live model-backed classification or provider calls
  - multi-agent or worker-agent execution
  - automatic taxonomy mutation or approval of a taxonomy-change request
  - live Zotero, OpenKB, PageIndex, ConDB, ChatIndex, source-pack, or index writes
  - credentials, permissions, rulesets, or secret handling changes
  - dev-to-main promotion, release tag, package publication, or production deployment
acceptance:
  - action evidence uses a versioned schema, traversal-safe action id and prior-decision ref, and mode-specific outcome values
  - review actions produce no-change, corrected, or escalated records; adjudication actions produce confirmed, corrected, or taxonomy-change-requested records
  - adjudication requires an unresolved prior decision and taxonomy-change-requested requires an explicit request record
  - resolved outcomes pass the classify stage while unresolved outcomes retain review routing and return CLI status 2
  - prior and final decisions remain linked by portable refs and exact paper, run, source-hash, and taxonomy identity
  - action records, final decisions, previews, queues, plans, stage state, and artifact refs are deterministic and byte-stable on exact reruns
  - invalid types, unknown fields, traversal, identity or taxonomy drift, and invalid outcome combinations fail before writes
  - input/output JSON schemas and user-facing CLI/storage documentation describe the offline contract
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, Speculoos validation, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_classification_actions tests.test_millefeuille_stage_cli tests.test_millefeuille_contract_artifacts tests.test_millefeuille_contract_models -v"
  - ".venv/bin/python -m unittest discover -v"
  - ".venv/bin/ruff check ."
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\", \"specs/**/*.yaml\"].flatten.sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\", \"specs/**/*.json\"].flatten.sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
  - "speculoos status --json"
  - "speculoos validate --task pr-075-classification-review-adjudication --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-075-classification-review-adjudication --pr-body specs/pr-075-classification-review-adjudication/pr-body.md --commit-message specs/pr-075-classification-review-adjudication/commit-message.txt --json"
publication_boundary:
