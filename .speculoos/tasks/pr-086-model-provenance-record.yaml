scope:
  - validate strict v0.1 model execution evidence against a deterministic no-call plan
  - materialize one provider-payload-free model provenance record to stdout or an explicit JSON output path
  - reject unknown fields, identity/control drift, invalid fallback resolution, invalid token totals, unsafe or duplicate refs, malformed warnings, and forbidden prompt/provider/private/secret payload markers
  - add v0.1 schemas, CLI documentation, README guidance, and regression coverage
non_goals:
  - credential lookup, provider/model calls, paid smoke tests, or live execution
  - accepting prompts, provider payloads, raw responses, private paper text, PDF bytes, secrets, or credentials as provenance evidence
  - appending model provenance to a verified run package, stage manifest, artifact index, source pack, OpenKB, PageIndex, ConDB, ChatIndex, or Zotero
  - live Zotero read/write, PDF recovery, OCR, source-pack mutation, OpenKB/index writes, classification, or writeback
  - dev-to-main promotion, release tag, package publication, production deployment, or approval bypass
acceptance:
  - models --provenance loads a plan file plus model execution evidence and returns a strict millefeuille-model-provenance/v0.1 JSON object
  - optional --output creates only that JSON object at a new no-follow local path without replacing an existing file or mutating a run package
  - the plan must match the canonical bundled profile, and evidence must match its profile, stage, requested model, provider, backend, reasoning effort, fast mode, prompt version, and fallback resolution
  - optional output must reject verified run-package destinations as well as symlink, existing-file, and replacement-race boundaries
  - usage token totals, refs, warning records, schema versions, and additionalProperties fail closed
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, private-data scan, Speculoos validation, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_model_execution tests.test_millefeuille_stage_cli tests.test_millefeuille_contract_artifacts -v"
  - ".venv/bin/python -m unittest discover -v"
  - ".venv/bin/ruff check ."
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\", \"specs/**/*.yaml\"].flatten.sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\", \"specs/**/*.json\"].flatten.sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
  - "speculoos validate --task pr-086-model-provenance-record --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-086-model-provenance-record --pr-body specs/pr-086-model-provenance-record/pr-body.md --commit-message specs/pr-086-model-provenance-record/commit-message.txt --json"
publication_boundary:
  statement: "Offline model provenance materialization, schema, documentation, and tests only. No credential lookup, provider/model call, private paper read, live Zotero/OpenKB/index/source-pack mutation, run-package provenance append, main-branch merge, release, package publication, production deployment, or approval bypass."
documentation_impact:
