write_paths:
  - .speculoos/croquis/pr-086-model-provenance-record.yaml
  - .speculoos/moulinettes/pr-086-model-provenance-record.yaml
  - .speculoos/tasks/pr-086-model-provenance-record.yaml
  - README.md
  - millefeuille/cli/stages.py
