scope:
  - preserve exact binary reads on Windows by enabling binary and non-inheritable
    descriptor flags when the platform exposes them
  - separate stable object identity from mutation snapshots so POSIX retains
    change-time checks while Windows avoids inconsistent descriptor-side ctime
  - reject symbolic links, Windows reparse points, non-directories, and unstable
    zero-inode identities in the portable read fallback
  - bind pre-open, descriptor, post-open path, and post-read observations to the
    same regular file with size and modification-time stability checks
  - document the portable fallback and add synthetic cross-platform regressions
non_goals:
  - weakening descriptor-relative no-follow reads or batch-retrieval fail-closed
    behavior on POSIX or platforms without the required directory primitives
  - accepting reparse-backed parents or files, unstable object identities,
    partial reads, or mutation during inspection
  - changing artifact formats, retrieval semantics, provider adapters, or write
    paths beyond the portable secure-read compatibility fix
  - credentials, provider/model/OCR calls, live Zotero reads or writes, private
    paper access, PDF recovery, source-pack mutation, or OpenKB/PageIndex writes
  - dev-to-main promotion, release tags, package publication, deployment, or
    approval bypass
acceptance:
  - portable reads round-trip binary bytes exactly without newline or control-Z
    translation
  - Windows read-side ctime drift does not create false failures while POSIX
    ctime remains a mutation signal
  - path replacement, in-place mutation, short reads, zero-inode identities,
    symbolic links, reparse points, and non-regular paths fail closed
  - existing retrieval behavior and repository-wide tests remain green
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check,
    private-data scan, Speculoos validation, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_secure_io tests.test_millefeuille_retrieve -v"
  - ".venv/bin/python -m unittest discover -s tests"
  - ".venv/bin/ruff check ."
  - "git diff --check"
  - "speculoos validate --task pr-097-windows-secure-reads --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-097-windows-secure-reads --pr-body specs/pr-097-windows-secure-reads/pr-body.md --commit-message specs/pr-097-windows-secure-reads/commit-message.txt --json"
