  - tests/test_millefeuille_source_hash_compatibility.py
scope:
  - accept strict sha256:<hex> identities from v0.1 single-PDF source packs
  - accept strict sha256-aggregate:<hex> identities from v0.2 multi-PDF source packs
  - align retrieval-index runtime validation, JSON Schema, contract documentation,
    fixture loading, and regression coverage
  - preserve the aggregate source identity across multi-PDF manifest parsing and
    retrieval-index record materialization
non_goals:
  - accepting uppercase, whitespace-padded, newline-tainted, truncated, oversized,
    or non-SHA-256 identities
  - changing source-pack hashing algorithms or retrieval/index behavior beyond
    strict identity compatibility
  - credentials, provider/model/OCR calls, live Zotero reads or writes, private
    paper access, PDF recovery, source-pack mutation, or OpenKB/PageIndex writes
  - dev-to-main promotion, release tags, package publication, deployment, or
    approval bypass
acceptance:
  - runtime and schema validation accept exactly sha256:<64 lowercase hex> and
    sha256-aggregate:<64 lowercase hex>
  - malformed, uppercase, padded, newline-tainted, wrong-prefix, short, and long
    identities fail closed
  - the fixture loader preserves both accepted identities without normalization
  - a synthetic v0.2 multi-PDF source-pack aggregate hash reaches the retrieval
    index unchanged
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check,
    private-data scan, Speculoos validation, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_source_hash_compatibility -v"
  - ".venv/bin/python -m unittest discover -s tests"
  - ".venv/bin/ruff check ."
  - "git diff --check"
  - "speculoos validate --task pr-094-aggregate-source-hash --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-094-aggregate-source-hash --pr-body specs/pr-094-aggregate-source-hash/pr-body.md --commit-message specs/pr-094-aggregate-source-hash/commit-message.txt --json"
publication_boundary:
  statement: Offline retrieval-index runtime, schema, contract, synthetic tests,
    and Speculoos metadata only. No credential lookup, provider/model/OCR call,
    private paper read, live Zotero/OpenKB/PageIndex/source-pack mutation,
    stable-branch promotion, release, package publication, deployment, or
    approval bypass.
documentation_impact:
