acceptance:
  - dry-run with a filesystem `--artifact-root` keeps writing under `<artifact-root>/<paper-id>/<run-id>/`
  - dry-run with `--artifact-root source-pack --source-pack-root <fixture-root>` writes under the verified source pack analysis directory
  - missing source-pack manifests fail before artifact output is written
  - source-pack-mode stage manifests remove PDF recovery/source-pack-write manual gates and record the source-pack stage as passed
