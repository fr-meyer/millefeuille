scope:
  - keep Zotero read and write credentials explicit with no implicit fallback
  - make missing read/write key errors concise and action-oriented
  - document read-only, writeback, and single-key writeback env patterns
  - add tests for no-fallback policy and explicit same-key acceptance
non_goals:
  - live Zotero reads or writes
  - PDF recovery, OCR/Mistral/PageIndex provider calls, OpenKB writes, or source-pack writes
  - credential changes or secret handling changes
  - dev-to-main promotion, release tag, or package publication
  - fallback from ZOTERO_WRITE_KEY to ZOTERO_READ_KEY
acceptance:
  - missing ZOTERO_READ_KEY fails with concise read-access guidance
  - missing ZOTERO_WRITE_KEY fails only when write features are active
  - explicitly setting the same value for ZOTERO_READ_KEY and ZOTERO_WRITE_KEY is accepted
  - README shows supported credential patterns without over-explaining internals
