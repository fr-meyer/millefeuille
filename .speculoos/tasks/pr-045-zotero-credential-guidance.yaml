id: pr-045-zotero-credential-guidance
title: Tighten Zotero credential guidance
status: implementation
branch: fix/pr-045-zotero-credential-guidance
base_branch: dev
github:
  issue: null
  pull_request: 45
  issue_project_item: null
  pull_request_project_item: null
  project_status: In Progress
  project_item: null
scope:
  - keep Zotero read and write credentials explicit with no implicit fallback
  - make missing read/write key errors concise and action-oriented
  - document read-only, writeback, and single-key writeback env patterns
  - add tests for no-fallback policy and explicit same-key acceptance
non_goals:
  - live Zotero reads or writes
  - PDF recovery, OCR/Mistral/PageIndex provider calls, OpenKB writes, or source-pack writes
  - credential changes or secret handling changes
  - dev-to-main promotion, release tag, or package publication
  - fallback from ZOTERO_WRITE_KEY to ZOTERO_READ_KEY
acceptance:
  - missing ZOTERO_READ_KEY fails with concise read-access guidance
  - missing ZOTERO_WRITE_KEY fails only when write features are active
  - explicitly setting the same value for ZOTERO_READ_KEY and ZOTERO_WRITE_KEY is accepted
  - README shows supported credential patterns without over-explaining internals
validation:
  - ".venv/bin/python -m unittest tests.test_zotero_credentials_policy tests.test_outcome_tag_removal tests.test_selection_tagging"
  - ".venv/bin/ruff check millefeuille/cli/main.py millefeuille/domain/config.py tests/test_zotero_credentials_policy.py tests/test_outcome_tag_removal.py tests/test_selection_tagging.py"
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\"].sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\"].sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
publication_boundary:
  statement: "Credential-guidance code/docs/tests only; no live Zotero read or write, PDF recovery, OCR/Mistral/PageIndex provider call, OpenKB write, source-pack write, credential value change, main-branch merge, release tag, package publication, or approval bypass."
