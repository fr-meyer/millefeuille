  rationale: The native transaction specification documents implementation semantics; no user-facing README or docs surface changes are required.
publish_authority: The isolated unpublished Mac repair and offline checks are authorized; another repository push and one additional automatic CI run require separate approval. Prior source and publication receipts are preserved. Private effects require separate exact approval.
private_data_scan: Required; fixtures and failure mutations are synthetic.
