scope:
  - Bind exactly the validated original-run layout including run_id summaries
  - Replace unsafe native pathname writes with descriptor-anchored transactions
  - Commit each run metadata pair and acceptance reports under one native reader barrier
  - Preserve exact backups and require recovery after ownership drift or rollback failure
  - Preserve materialized classification bindings for byte-identical repeat runs
  - Run three prototype native Windows controls and current-head tests in bounded GitHub Actions
  - Preserve portable metadata reads and read-only DTO fixtures on unsupported native-write platforms
  - Preflight unqualified metadata writers before export and offline-stage effects
acceptance:
  - Original native symlink and partial-acceptance regressions fail without errors
  - Repaired synthetic transactions, affected native callers, Ruff, format, metadata and diff checks pass
  - No raw multi-file atomicity or unconditional rollback claim
  - Existing six merge-result CI jobs and the additive exact-head Windows job all pass before readiness
  - Three native controls have positive capability baselines and zero skips, errors or failures
publication_boundary:
  statement: Source code, synthetic fixtures and task/spec metadata only. No private source-pack, provider, broker, credential, GCP management, index, model or release effects. Live journals, replacements, reports and recovery require separate exact authorization.
documentation_impact:
