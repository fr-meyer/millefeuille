  - dev-to-main promotion, release tag, or package publication
acceptance:
  - acceptance synthesis writes a stable summary artifact and marks the acceptance stage passed only when source-pack through index evidence is complete or explicitly waived
  - classification preview requires acceptance evidence, emits plan plus per-paper decision records, and records rejected alternatives, review queues, and writeback previews
  - writeback preview consumes classification output and emits a governed Zotero writeback plan without live mutation
  - retrieve, models, and run subcommands surface the offline artifact package without requiring live provider credentials
  - run executes fixture stages through writeback in canonical order and resumes only after passed-stage outputs revalidate
  - identical evidence reruns are idempotent, drift fails closed, and invalid classification evidence leaves no partial writeback preview
  - approved-live modes stop at the documented manual-gate exit without a provider or Zotero mutation
  - artifact indexes and stage manifests surface acceptance, classify, and writeback outputs when they exist under a verified source-pack run directory
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, and Speculoos validate pass
