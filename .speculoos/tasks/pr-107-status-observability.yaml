scope:
  - add a strict read-only status surface joining canonical source-pack,
    stage-manifest, artifact-index, and progressively supplied observations
  - require exact identities, references, lane sets, stage outputs, content
    digests, and canonical Zotero source and post-write versions
  - expose deterministic sanitized blockers and explicitly non-authoritative
    observational readiness through the status CLI
  - add strict JSON Schemas, operator documentation, compatibility coverage,
    hostile-input regressions, and repository-governance metadata
non_goals:
  - credential access, provider/model/OCR calls, private-paper reads, source-pack
    mutation, or live Zotero/OpenKB/PageIndex operations
  - treating supplied observations as authoritative proof of a live effect
  - weakening exact identity, secure-read, bounded-input, or manual-gate rules
  - dev-to-main promotion, release tags, package publication, deployment, or
    approval bypass
acceptance:
  - canonical joins fail closed on identity, reference, digest, lane, stage,
    version, schema, or observation drift
  - output remains deterministic, sanitized, bounded, read-only, and explicit
    about authority and every blocking condition
  - legacy index-only status remains compatible while canonical source-pack
    status exposes the complete joined surface
  - approved-live output can become observational-live-ready but never claim
    authoritative or unqualified live completion
  - focused tests, full unittest discovery, schema parsing, Ruff, changed-file
    format, diff, private-data, Speculoos, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_status_observability tests.test_millefeuille_artifact_commands tests.test_millefeuille_contract_artifacts"
  - ".venv/bin/python -m unittest discover -s tests"
  - ".venv/bin/ruff check ."
  - ".venv/bin/ruff format --check millefeuille/cli/artifacts.py millefeuille/domain/artifacts.py millefeuille/domain/status_observability.py tests/test_millefeuille_artifact_commands.py tests/test_millefeuille_contract_artifacts.py tests/test_millefeuille_status_observability.py"
  - "git diff --check"
  - "speculoos validate --task pr-107-status-observability --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-107-status-observability --pr-body specs/pr-107-status-observability/pr-body.md --commit-message specs/pr-107-status-observability/commit-message.txt --json"
publication_boundary:
  statement: Repository-local read-only status joins, sanitized observation
    envelopes, CLI reporting, schemas, documentation, synthetic tests, and
    Speculoos metadata only. No credential access, provider/model/OCR call,
    private-paper read, source-pack mutation, live Zotero/OpenKB/PageIndex
    write, stable-branch promotion, release, tag, package publication,
    deployment, or approval bypass.
documentation_impact:
