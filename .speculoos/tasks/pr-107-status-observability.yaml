  rationale: The feature diff already updates the top-level README, pipeline
    navigation, artifact-storage contract, CLI contract, vision, and dedicated
    status-observability contract. This follow-up adds governance metadata only.
private_data_scan: required; public source, documentation, schemas, synthetic
  tests, and repository-local Speculoos metadata only, with no credentials,
  private papers, provider payloads, or host-specific paths
publish_authority: Active Millefeuille delivery-train supervisor; routine
  feature-to-dev publication, exact-head Mergeguez review, policy-gated merge,
  dependent-PR retargeting, cleanup, and next-episode advancement are approved.
  Live operations, dev-to-main promotion, release, and deployment remain
  excluded.
