scope:
  - add read-only artifact-index load, validation, write, path resolution, and completion helpers
  - add `millefeuille artifacts` inspection command outside the live Hydra/Zotero path
  - add `millefeuille status` completeness command with optional strict exit behavior
  - add fixture-only artifact-index coverage for complete and blocked runs
  - keep artifact/status commands independent from Zotero, OCR providers, model calls, OpenKB, PageIndex, ConDB, and ChatIndex clients
non_goals:
  - live Zotero reads or writes
