  - implementing structure, summarization, paper-card generation, classification, or writeback
  - changing credential values or secret handling
  - dev-to-main promotion, release tag, or package publication
acceptance:
  - artifact-index fixtures load and round-trip offline
  - "`millefeuille artifacts --index ... --json` emits artifact refs"
  - "`millefeuille status --index ... --strict` exits 2 for blocked fixture state"
  - "`python -m millefeuille status --index ... --json` succeeds without Zotero env vars"
  - full unit tests, Ruff, metadata parse, diff check, and Speculoos validate pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_artifact_commands"
  - ".venv/bin/python -m unittest discover -v"
  - ".venv/bin/ruff check ."
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\", \"specs/**/*.yaml\"].flatten.sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\", \"specs/**/*.json\"].flatten.sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
  - "speculoos status --json"
  - "speculoos validate --task pr-048-millefeuille-artifact-store-status --validation \"git diff --check\" --json"
publication_boundary:
