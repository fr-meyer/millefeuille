scope:
  - add a strict approved-live receipt model, JSON Schema, bounded secure loader,
    canonical SHA-256 identity, expiry window, and exact single-use replay state
  - bind exact operations, targets, selectors, item caps, runs, roots,
    provider/model choices, call and cost limits, disposal, and stop conditions
  - reject tampering, replay, wildcard scope, secret-like material, duplicate
    fields, malformed or non-finite JSON, digest forgery, and authorization drift
  - emit allowlisted self-verifying audit records with canonical root identities
    and no credential material
  - expose an explicit CLI receipt gate while preserving the no-effect exit-3
    boundary because approved-live provider and persistence effects remain
    unimplemented
  - extend secure no-follow reads with a backwards-compatible byte limit and
    file-growth detection
non_goals:
  - implementing or performing provider/model/OCR calls, credential lookup,
    private paper access, PDF recovery, or live Zotero/OpenKB/PageIndex writes
  - treating a valid receipt as proof that any requested live effect completed
  - accepting unbounded, wildcard, reusable, expired, or scope-drifted authority
  - dev-to-main promotion, release tags, package publication, deployment, or
    approval bypass
acceptance:
  - canonical receipts bind every approved-live dimension and reject any
    mutation, replay, expiry, duplicate key, malformed value, or scope drift
  - replay state is reserved exactly once and audit output is deterministic,
    allowlisted, self-verifying, and secret-free
  - CLI receipt validation remains fail-closed and cannot promote the
    unimplemented approved-live path beyond exit code 3
  - bounded secure reads reject oversize input and growth without weakening
    existing no-follow and identity protections
  - focused tests, full unittest discovery, schema parsing, Ruff, diff check,
    private-data scan, Speculoos validation, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_live_receipts tests.test_millefeuille_secure_io tests.test_millefeuille_stage_cli tests.test_millefeuille_contract_artifacts"
  - ".venv/bin/python -m unittest discover -s tests"
  - ".venv/bin/ruff check ."
  - "git diff --check"
  - "speculoos validate --task pr-102-approved-live-receipts --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-102-approved-live-receipts --pr-body specs/pr-102-approved-live-receipts/pr-body.md --commit-message specs/pr-102-approved-live-receipts/commit-message.txt --json"
publication_boundary:
