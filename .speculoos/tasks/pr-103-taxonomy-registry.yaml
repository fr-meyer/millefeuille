scope:
  - add deterministic content-addressed two-level taxonomy registries and
    immutable scope locks
  - add offline proposal, independent three-role review, application, and
    forward-only rollback artifacts with CLI commands
  - preserve stable IDs during rollback, restore historical entries exactly,
    and deprecate later-added IDs without mutating their other values
  - enforce requester, reviewer, and applier separation
  - add strict JSON Schemas, a deliberately non-authoritative example,
    governance documentation, and regression coverage
non_goals:
  - taxonomy generation or approval of any production taxonomy
  - credential access, provider/model calls, private-paper reads, source-pack
    mutation, classification, or live Zotero/OpenKB/PageIndex writes
  - dev-to-main promotion, release tags, package publication, deployment, or
    approval bypass
acceptance:
  - registry and lock identities are canonical, deterministic, bounded, and
    fail closed on malformed, duplicate, unknown, or mutable input
  - proposal, review, application, and rollback artifacts preserve exact
    lineage and enforce requester/reviewer/applier separation
  - rollback restores prior entries exactly while retaining and deprecating
    later-added stable IDs
  - CLI operations remain repository-local and offline with deterministic,
    schema-valid outputs
  - focused tests, full unittest discovery, schema parsing, Ruff, changed-file
    format, diff, private-data, Speculoos, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_taxonomy_registry tests.test_millefeuille_contract_artifacts"
  - ".venv/bin/python -m unittest discover -s tests"
  - ".venv/bin/ruff check ."
  - ".venv/bin/ruff format --check millefeuille/cli/main.py millefeuille/cli/taxonomy.py millefeuille/domain/taxonomy.py tests/test_millefeuille_contract_artifacts.py tests/test_millefeuille_taxonomy_registry.py"
  - "git diff --check"
  - "speculoos validate --task pr-103-taxonomy-registry --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-103-taxonomy-registry --pr-body specs/pr-103-taxonomy-registry/pr-body.md --commit-message specs/pr-103-taxonomy-registry/commit-message.txt --json"
