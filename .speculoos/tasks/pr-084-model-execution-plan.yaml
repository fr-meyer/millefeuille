private_data_scan: required; source, schema, tests, and public planning metadata only, with no credentials, private papers, provider payloads, or host-specific paths
publish_authority: Franck's 2026-07-19 instruction to resume the Millefeuille parent objective; routine policy-gated feature-to-dev publication, review, merge, and cleanup continue without another approval, while dev-to-main remains excluded
