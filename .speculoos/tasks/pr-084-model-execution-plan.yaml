scope:
  - add a deterministic no-call execution plan for page, section, and full-paper summary profiles
  - expose requested model and parameters, authentication lane, fallback policy, live blockers, and future provenance requirements
  - preserve the existing profile catalog and offline-preview behavior
  - add a strict v0.1 execution-plan schema, CLI surface, documentation, and regression coverage
non_goals:
  - provider/model calls, paid smoke tests, or credential lookup
  - actual resolved-model, usage, input, output, or quality-evidence claims
  - OpenClaw routing, authentication, fallback, or fast-mode configuration changes
  - live Zotero read/write, PDF recovery, OCR, source-pack mutation, OpenKB/index writes, classification, or writeback
  - dev-to-main promotion, release tag, package publication, or production deployment
acceptance:
  - models --plan resolves only supported summary stages from an explicit bundled profile
  - research-default plans select openai/gpt-5.6-sol, xhigh reasoning, fast_mode off, OpenClaw-native Codex OAuth, and no fallback
  - offline-preview plans remain fixture-only with no provider blockers
  - plans state that credential lookup and provider execution were not performed and approved-live execution is not ready
  - provenance requirements include requested and resolved model, profile/stage, source/output refs, usage, and quality warnings without claiming actual values
  - malformed profiles, unknown profiles, unsupported stages, and invalid fallback combinations fail closed
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, private-data scan, Speculoos validation, and publication checks pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_model_execution tests.test_millefeuille_stage_cli tests.test_millefeuille_contract_artifacts -v"
  - ".venv/bin/python -m unittest discover -v"
  - ".venv/bin/ruff check ."
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\", \"specs/**/*.yaml\"].flatten.sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\", \"specs/**/*.json\"].flatten.sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
  - "speculoos validate --task pr-084-model-execution-plan --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-084-model-execution-plan --pr-body specs/pr-084-model-execution-plan/pr-body.md --commit-message specs/pr-084-model-execution-plan/commit-message.txt --json"
publication_boundary:
  statement: "Offline model execution planning, schema, documentation, and tests only. No credential lookup, provider/model call, private paper read, live Zotero/OpenKB/index/source-pack mutation, main-branch merge, release, package publication, production deployment, or approval bypass."
documentation_impact:
  status: updated
  rationale: README and pipeline contracts document the no-call planning surface and preserve all live approval gates.
branch_plan: Build one bounded feature PR from synchronized dev, validate it, publish through the approved broker, obtain exact-head Mergeguez review, merge to dev under branch policy, and clean up the branch; stop before dev-to-main promotion.
