scope:
  - add a strict versioned retrieval batch manifest covering paper-id, Zotero-key, source-pack-slug, DOI, and title locators
  - preflight every locator and verified artifact package through one pinned source-root descriptor before any aggregate write
  - snapshot every inspected file, missing optional input, and enumerated corpus entry, retain the external batch manifest bytes, and revalidate that input set under the cooperative batch lock immediately before commit
  - reject malformed or non-string fields, unsafe refs, missing or ambiguous identities, and duplicate resolved paper/run identities
  - apply existing summary, location, classification-evidence, and index-lane filters uniformly across a batch
  - emit sorted portable allowlisted ref/status JSON and Markdown aggregates beneath the batch root without artifact-controlled summary IDs
  - publish aggregates from pinned source-root and batch-directory descriptors by verifying a complete unpublished staging generation through held descriptors, making it read-only, and using an atomic no-replace rename as the commit point within a trusted-ownership or cooperative same-UID writer boundary
  - on pre-commit failure, scrub only owned staged inodes through held descriptors and leave the temporary generation in its reached mode plus unverified namespace entries in place for explicit operator cleanup
  - fail closed before aggregate publication when required POSIX no-follow, descriptor-relative, directory-lock, or no-replace-rename primitives are unavailable
  - keep exact reruns byte-stable and avoid loading or returning private paper content
non_goals:
  - live Zotero reads or writes, PDF recovery, OCR, provider/model calls, or worker-agent execution
  - OpenKB, PageIndex, ConDB, ChatIndex, source-pack, or live index writes
  - returning paper, summary, card, PDF, or provider payload content
  - credentials, permissions, rulesets, schedulers, or secret handling changes
  - stable-branch changes, release, or package publication; the approved dev-only PR/review/merge lane is in scope
acceptance:
  - the CLI accepts either one existing single-run locator or one strict v0.1 batch manifest, never both
  - all five existing locator forms resolve in batch mode and preserve their locator type
  - complete preflight prevents aggregate writes when any later locator, package, identity, or ref is invalid
  - duplicate resolved paper/run identities and traversal, descendant symlink substitution, linked, displaced, substituted, same-inode mutation, hard-link-injection, unexpected-entry, or late-destination hazards detected in unpublished staging fail closed before the atomic rename commit, and external hard links retain no aborted aggregate bytes
  - source artifact, optional-input, corpus-enumeration, or external-manifest changes observed by the final under-lock snapshot revalidation fail closed before commit
  - the documented trust boundary states that POSIX locks and mode bits serialize cooperative writers but do not protect against an uncooperative same-UID owner racing after the final check
  - batch mode fails closed without POSIX no-follow primitives while legacy single-run retrieval and public loader error prefixes remain compatible
  - aggregate JSON follows the v0.1 result schema, accepts both single-PDF and aggregate source hashes, and Markdown contains only allowlisted metadata
  - runs, matched summaries, lanes, and source-pack-root-relative slash-normalized refs are deterministic
  - coherent retrieval filters apply uniformly and identical reruns are byte-stable no-ops while changed existing output fails closed as drift
  - focused tests, full unittest discovery, Ruff, metadata parse, diff check, and Speculoos validation pass
validation:
  - ".venv/bin/python -m unittest tests.test_millefeuille_retrieval_batch tests.test_millefeuille_retrieve tests.test_millefeuille_stage_cli tests.test_millefeuille_contract_artifacts -v"
  - ".venv/bin/python -m unittest discover -v"
  - ".venv/bin/ruff check ."
  - "ruby -ryaml -rjson -e 'Dir[\".speculoos/**/*.yaml\", \"specs/**/*.yaml\"].flatten.sort.each { |p| Psych.parse_file(p) }; Dir[\".speculoos/**/*.json\", \"specs/**/*.json\"].flatten.sort.each { |p| JSON.parse(File.read(p)) }; puts \"metadata ok\"'"
  - "git diff --check"
  - "speculoos status --json"
  - "speculoos validate --task pr-079-batch-retrieval --validation \"git diff --check\" --json"
  - "speculoos publish-check --task pr-079-batch-retrieval --pr-body specs/pr-079-batch-retrieval/pr-body.md --commit-message specs/pr-079-batch-retrieval/commit-message.txt --json"
publication_boundary:
